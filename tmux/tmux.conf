# ───────────────────────── general ─────────────────────────

# Prefix: Ctrl-a (Ctrl-b conflicts with vi/less paging)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Truecolor — tmux internal term + RGB from the outer terminal (ghostty/alacritty)
set-option -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"

# Larger scrollback, snappy escape, focus events for nvim autoread
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on
set -g mouse on

# 1-indexed windows/panes, renumber on close, no auto-rename clobbering zsh hooks
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off

# Pass window title through to the outer terminal
set -g set-titles on
set -g set-titles-string "#T"

# ───────────────────────── keybindings ─────────────────────────

# Reload config
bind r source-file ~/.tmux.conf \; display-message " ✓ reloaded"

# Splits preserve current working directory
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# Vim-style pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resize (hold prefix + Shift+HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Vi-mode copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

# ───────────────────────── theme (Tokyo Night) ─────────────────────────
# Palette: base #1a1b26 · text #c0caf5 · subtle #565f89 · blue #7aa2f7
#          pink #f7768e · green #9ece6a · yellow #e0af68 · purple #bb9af7

set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=default fg=#c0caf5'

# Left: session pill
set -g status-left-length 40
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=default] '

# Right: date + time in subtle/blue
set -g status-right-length 60
set -g status-right '#[fg=#565f89] %a %b %d  #[fg=#7aa2f7]󰥔 %H:%M '

# Window list — inactive subtle, active yellow
set -g window-status-separator ''
set -g window-status-format         '#[fg=#565f89] #I:#W '
set -g window-status-current-format '#[fg=#e0af68,bold] #I:#W '
set -g window-status-activity-style 'fg=#f7768e'
setw -g monitor-activity on
set -g visual-activity off

# Messages (display-message)
set -g message-style 'fg=#1a1b26 bg=#7aa2f7 bold'
set -g message-command-style 'fg=#c0caf5 bg=#1a1b26'

# Pane borders + labels
set -g pane-border-status top
set -g pane-border-format ' #[fg=#565f89]#{pane_index}  #[fg=#c0caf5]#{pane_current_command} '
set -g pane-border-style 'fg=#283457'
set -g pane-active-border-style 'fg=#7aa2f7'

# Mode (copy/selection) indicator
set -g mode-style 'fg=#1a1b26 bg=#e0af68'

# Clock mode
set -g clock-mode-colour '#7aa2f7'

# ───────────────────────── plugins (TPM) ─────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-yank: don't jump to end after selecting
set -g @yank_action 'copy-pipe'

run -b '~/.tmux/plugins/tpm/tpm'
