# Tokyo Night — matches waybar / swaync / ghostty
font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
prompt=" "
icon-theme=Adwaita
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
layer=overlay
exit-on-keyboard-focus-loss=yes
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=22

[border]
width=1
radius=14

[colors]
background=1a1b26ee
text=c0caf5ff
prompt=7aa2f7ff
placeholder=565f89ff
input=c0caf5ff
match=7aa2f7ff
selection=283457ee
selection-text=c0caf5ff
selection-match=7aa2f7ff
counter=565f89ff
border=7aa2f7aa

[key-bindings]
cancel=Escape Control+g Control+bracketleft
